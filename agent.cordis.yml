# ⚠️ POINTER DOCUMENT — the host never reads this file's rows directly.
#
# Since DSH 0.1.7-alpha, agent presets are declaration rows carried by bundle
# patches: a `preset-<id>` row named `@deepseek-ai/dsh-agent-preset` whose
# `config.plugins` holds the full Cordis entry list. Nothing in the host reads
# the legacy `~/.dsh/.agent-presets/<id>/agent.cordis.yml` any more — a preset
# deployed only as this pair of files never appears in the session preset
# picker.
#
# The operative composition lives in the generated `cordis.patch.yml`, row
# `preset-expert-orchestrator` (id `expert-orchestrator`, display name
# 专家编排模式). The composition ROWS at the bottom of this file are the
# GENERATOR'S SOURCE: `scripts/gen-preset-declaration.mjs` re-indents them
# into that row and — when the bundled-core roster is non-empty — appends the
# roster-driven `/expert-` gesture declaration line (skill-filesystem
# customSkillDirs += …/skills/expert-gestures) plus the gesture header note.
# With an EMPTY roster the generator reproduces the pre-gesture declaration
# byte for byte (zero-regression guarantee). Edit the rows here, then run the
# generator; never edit the generated patch by hand.
#
# This directory itself stays meaningful as the preset's RUNTIME DATA root —
# the `skill-filesystem` row of the declaration resolves its `customSkillDirs`
# here (`DSH_HOME || ~/.dsh` + `.agent-presets/expert-orchestrator/skills`):
#
#   skills/expert-orchestration/   the orchestration protocol skill (PROTOCOL
#                                  refresh + bundled core experts)
#   skills/expert-gestures/        the /expert-<name> zero-token user gesture
#                                  skills — one per bundled-core expert,
#                                  generated with the declaration by the same
#                                  script; modelInvocable:false, injected
#                                  deterministically by the host pre-step hook
#                                  (never in the model skill catalog)
#   skills/trim-cli/               the trim-cli skill router (PROTOCOL refresh)
#   expert-lessons/, expert-methods/, lessons.md, expert-sources/
#                                  runtime user data (created when missing,
#                                  never overwritten, never deleted)
#
# `preset.yml` next to this file is kept for the same documentary reason.
#
# History: the full composition (persona prefix, shell/fs/jobs/skill/goal rows,
# planning + compaction + delegation isolate groups, tool/toolFilter settings)
# used to live verbatim in this file; it moved unchanged into the declaration
# row by `scripts/gen-preset-declaration.mjs`, with ONE deliberate fix —
# `skill-filesystem.customSkillDirs` no longer resolves against `baseUrl`
# (under declaration-row mounts `baseUrl` is the preset registry's resolution
# base, not this directory) but mirrors the deployer's own
# `resolvePresetTargetDir()` formula instead. In 2.7 (T14) the rows came back
# below as the generator's source — the pointer rewrite had left the original
# one-shot script without any `- id:` rows to read (it threw 'no row found').
# The host still never reads this file.

# ── composition rows (generator source; host never reads this file) ─────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # suffix 省略：{{cwd}} 不是注册的提示词变量（agent loop 仅注册 provider/model，2026-10 故障），
    # 工作目录由 harness 的 working-directory 服务经 runtime context 提供，无需 persona 后缀
    prefix: |-
      你是一名专家编排代理 (Expert Orchestrator)。你的核心职能不是亲自完成工作：实施类改动一律委派专家执行，你负责分诊、请 PM 规划、委派、检查点重排、验证与整合。

      铁律：实施请求或上下文发生变化时重开循环；只读追问与继续类消息不重开全流程——有活跃计划先查当前项目板状态再续，无活跃计划按只读处理。用户对在途工作的纠正即时作废对应任务书与委派。实施细则以 expert-orchestration 技能为单一来源。

      工作循环：
      1. 分诊（每条消息先归类，按三级）：
         - 大型任务：跨 ≥2 个领域、或 ≥3 个产出物、或目标模糊需要拆解——先 PM 规划，再逐项委派专家。
         - 小型实施：不产生新计划需要的改动，如 ≤3 个文件的聚焦修改——可免 PM，但仍必须委派 1 名执行专家实施，你只做验收。
         - 只读操作：问答、检索、读文件、跑测试核对结论——可直接亲自做。
      2–5（PM 规划、执行编排、交付门禁、整合沉淀）：细则见技能——小型实施免独立评审与 PM 检查点、仅编排者验收；git commit 前的检查为不可豁免硬门禁。
      涉及实施工作或专家委派的轮次，先加载 expert-orchestration 技能并遵循其完整协议；发现技能与本文不一致时停止该步并在交付说明中上报用户，不得自行取舍。
      共享协作铁律（对编排者与本 preset 直派的 subagent/fork 子代理成立；Agency 召唤专家由任务书承载）：
      ① 只读核实先于断言：给出任何结论或执行任何写操作前，先用只读手段核实当前事实。
      ② 写操作前先核对工作树状态，禁止用 git restore / git checkout 清理非本任务产生的改动。
      ③ 发现他人未提交改动立即上报，不得覆盖或擅自恢复。
      ④ 完整产出落盘为文件，给召唤方/协调者的回复只保留精简摘要。

      当前驱动模型：{{model}}。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536


- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'


- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false


- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'


- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:path').join(process.env.DSH_HOME || process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh'), '.agent-presets', 'expert-orchestrator', 'skills')"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'


- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'


- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.


- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 32768
        headChars: 4096
        tailChars: 1024


- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable
        maxDepth: 1
        toolFilter:
          deny: [] # 递归隔离由召唤期运行时动态求交承担（lib/tools.js EXPERT_TOOLS_DENY_LIST × 宿主注册面）；静态点名未注册名会使宿主 restrict 整体拒绝通道

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
        maxDepth: 1
        toolFilter:
          deny: [] # 同上：静态点名未注册名会使宿主 restrict 整体拒绝通道

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64


- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
